<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BMI計算ツール</title>
  <style>
    body { font-family: sans-serif; max-width: 480px; margin: 0 auto; padding: 16px; }
    label { display: block; margin-top: 12px; }
    input { width: 100%; padding: 8px; font-size: 16px; box-sizing: border-box; }
    button { margin-top: 16px; padding: 10px 20px; font-size: 16px; }
    #result { margin-top: 20px; font-size: 18px; }
    .error { color: #c0392b; }
  </style>
</head>
<body>
  <h1>BMI計算ツール</h1>

  <label for="height">身長（cm）</label>
  <input type="number" id="height" placeholder="例: 170">

  <label for="weight">体重（kg）</label>
  <input type="number" id="weight" placeholder="例: 60">

  <button id="calcBtn">計算する</button>
  <p id="result"></p>

  <script>
    // BMIを計算する関数
    function calculateBmi(heightCm, weightKg) {
      const heightM = heightCm / 100;
      return weightKg / (heightM * heightM);
    }

    // BMIから判定を返す関数
    function judgeBmi(bmi) {
      let label;
      if (bmi < 18.5) {
        label = "低体重（やせ）";
      } else if (bmi < 25) {
        label = "普通体重";
      } else {
        label = "肥満";
      }
      return label;
    }

    // 結果を表示する関数
    function showResult(message, isError) {
      const resultEl = document.getElementById("result");
      resultEl.textContent = message;
      resultEl.className = isError ? "error" : "";
    }

    // ボタン押下時の処理
    function onCalcClick() {
      const heightStr = document.getElementById("height").value;
      const weightStr = document.getElementById("weight").value;

      // 未入力チェック（Number("")は0になるので、変換前に文字列で判定）
      if (heightStr === "" || weightStr === "") {
        showResult("身長と体重の両方を入力してください。", true);
        return;
      }

      const height = Number(heightStr);
      const weight = Number(weightStr);

      // 0以下・数値でない場合
      if (isNaN(height) || isNaN(weight) || height <= 0 || weight <= 0) {
        showResult("身長と体重は0より大きい数字で入力してください。", true);
        return;
      }

      const bmi = calculateBmi(height, weight);
      const judgement = judgeBmi(bmi);
      showResult("BMI: " + bmi.toFixed(1) + "（" + judgement + "）", false);
    }

    document.getElementById("calcBtn").addEventListener("click", onCalcClick);
  </script>
</body>
</html>
